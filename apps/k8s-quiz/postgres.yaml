# Service headless : donne une identité DNS stable au Pod du StatefulSet (postgres-0.postgres)
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_DB,   value: quiz }
            - { name: POSTGRES_USER, value: quiz }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: quiz-secrets, key: db-password }
            # sous-dossier : évite l'erreur "directory not empty" (lost+found) sur certains volumes
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "quiz", "-d", "quiz"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # pas de storageClassName : utilise la StorageClass par défaut du cluster
        resources:
          requests:
            storage: 1Gi
